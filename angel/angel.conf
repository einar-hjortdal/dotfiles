# $HOME/.config/angel/angel.conf

let mod = super
let cursor = standard_pointer

set-background "$HOME/Pictures/Wallpapers/active.jpeg"
exec "$HOME/.config/angel/angel.sh"

# Layout \in {
#   angel_master_left,
#   angel_master_right,
#   angel_simple_vertical,
#   angel_simple_horizontal,
#   angel_monocle,
#   angel_master_left_monocle,
#   angel_master_right_monocle,
#   angel_master_master_left,
#   angel_master_master_right
# }

# Workspace number \in {1..10}. Those not 
# listed will use default. If no default 
# is specified during sets angel_master_left is used.
# layouts {
#     1 -> angel_monocle
# }

define terminal = "contour"

# Cursor \in {
#   standard_pointer,
#   text_insertion,
#   busy,
#   hand_shape,
#   crosshair,
#   four_df_resize,
#   horizontal_resize,
#   vertical_resize,
#   top_resize,
#   bottom_resize,
#   left_resize,
#   right_resize,
#   top_left_resize,
#   top_right_resize,
#   bottom_left_resize,
#   bottom_right_resize
# }
define root-cursor = $cursor
define minimized-height = 1%h
define new-focus-start = adjacent
define next-focus-on-close = use-stack

set default-workspace-layout = angel_simple_horizontal

set gap = 10

set resize-border-width = 3
set focused-border-width = 3
set unfocused-border-width = 3
set float-border-width = 3
set fullscreen-border-width = 0
set minimized-border-width = 0
set monocle-border-width = 0
set float-move-step = 15
set space-between-monocle = 20
set minimized-position = bottom
set minimized-height-inc = 0
set gap-inc-size = 0

color resize-border = "#89b4fa";
color focused-border = "#a6e3a1"
color unfocused-border = "#1e1e2e"
color float-border = "#f9e2af";
color fullscreen-border = "#6c7086";

bind-command $mod-d "echo 'Angel WM (AWM)'"
bind-command $mod-space "rlaunch \
  --font=sans-serif \
  --height=30 \
  --color0=#1e1e2e \
  --color1=#6c7086 \
  --color2=#cdd6f4 \
  --color3=#cdd6f4 \
  --color4=#89b4fa"
# bind-command $mod-shift-s screenshot

bind $mod-shift-r restart-manager
bind $mod-shift-q quit-manager
bind $mod-shift-c close-win
bind $mod-ret open-term

bind $mod-up win-up
bind $mod-left win-left
bind $mod-down win-down
bind $mod-right win-right

bind $mod-shift-up move-win-up
bind $mod-shift-left move-win-left
bind $mod-shift-down move-win-down
bind $mod-shift-right move-win-right

bind $mod-m enter-resize
bind $mod-m exit-resize
bind $mod-ctrl-up resize-up
bind $mod-ctrl-left resize-left
bind $mod-ctrl-down resize-down
bind $mod-ctrl-right resize-right

bind $mod-s toggle-float
bind $mod-f toggle-fullscreen
bind $mod-alt-space toggle-float-focus
bind $mod-b switch-float-focus

bind $mod-c minimize-win
bind $mod-tab toggle-minimize-focus

bind $mod-alt-1 tile_master_left
bind $mod-alt-2 tile_master_right
bind $mod-alt-3 tile_simple_vertical
bind $mod-alt-4 tile_simple_horizontal
bind $mod-alt-5 tile_monocle
bind $mod-alt-6 tile_master_left_monocle
bind $mod-alt-7 tile_master_right_monocle
bind $mod-alt-8 tile_master_master-left
bind $mod-alt-9 tile_master_master_right

bind $mod-alt-shift-1 minimize-left
bind $mod-alt-shift-2 minimize-right
bind $mod-alt-shift-3 minimize-top
bind $mod-alt-shift-4 minimize-bottom

bind $mod-comma switch-to-wprev
bind $mod-period switch-to-wnext

bind $mod-1 switch-to-w1
bind $mod-2 switch-to-w2
bind $mod-3 switch-to-w3
bind $mod-4 switch-to-w4
bind $mod-5 switch-to-w5
bind $mod-6 switch-to-w6
bind $mod-7 switch-to-w7
bind $mod-8 switch-to-w8
bind $mod-9 switch-to-w9
bind $mod-0 switch-to-w10

bind $mod-shift-1 move-to-w1
bind $mod-shift-2 move-to-w2
bind $mod-shift-3 move-to-w3
bind $mod-shift-4 move-to-w4
bind $mod-shift-5 move-to-w5
bind $mod-shift-6 move-to-w6
bind $mod-shift-7 move-to-w7
bind $mod-shift-8 move-to-w8
bind $mod-shift-9 move-to-w9
bind $mod-shift-0 move-to-w10

bind $mod-shift-ctrl-u unmap-workspace
bind $mod-shift-ctrl-m map-workspace

bind $mod-shift-u unmap-window
bind $mod-shift-m map-latest-unmap

bind $mod-u gap-dec
bind $mod-i gap-inc

bind $mod-alt-u minimize-dec
bind $mod-alt-i minimize-inc

bind $mod-alt-shift-space float-all-tiled
bind $mod-shift-space tile-all-float

bind $mod-shift-alt-c minimize-all-windows
bind $mod-shift-c unminimize-all-windows

bind $mod-shift-f focus-mode-focus
bind $mod-shift-p focus-mode-pointer

bind $mod-alt-m cycle-tiled-forward
bind $mod-shift-m cycle-tiled-backward

bind $mod-shift-a new-focus-start-adjacent
bind $mod-shift-e new-focus-start-end

bind $mod-alt-a next-focus-on-close-focus-stack
bind $mod-alt-e next-focus-on-close-next

bind $mod-p toggle-persistent
