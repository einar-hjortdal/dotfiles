[attrs.default]
bg = "#1e1e2e"
fg = "#cdd6f4"
font = "sans-serif 10"

[bars.top]
monitor = "DP-1"
position = "top"
height = 30
transparent = false
bg = "#1e1e2e"
default_attrs = "default"
margin_left = 10
margin_internal = 10
margin_right = 10
ipc = true
panels_left = ["xworkspaces", "separator", "xwindow"]
panels_center = ["pulseaudio"]
panels_right = ["network", "separator", "clock"]

[attrs.none]
color = "#1e1e2e"

[attrs.manual]
color = "#1e1e2e"

[attrs.active_blocks]
bg = "active"
fg = "#cdd6f4"

[attrs.nonempty_blocks]
bg = "nonempty"
fg = "#f9e2af"

[attrs.inactive_blocks]
bg = "inactive"
fg = "#6c7086"

[bgs.default]
style = "bubble_prop"
radius = 12
color = "#1e1e2e"

[bgs.manual]
style = "bubble"
border = 8
radius = 12
color = "#1e1e2e"

[bgs.active]
style = "bubble_prop"
radius = 3
color = "#6c7086"

[bgs.inactive]
style = "bubble_prop"
radius = 3
color = "#1e1e2e"

[bgs.nonempty]
style = "bubble_prop"
radius = 0
color = "#1e1e2e"

[bgs.none]
style = "none"

[panels.xworkspaces]
type = "xworkspaces"
attrs_active = "active_blocks"
attrs_nonempty = "nonempty_blocks"
attrs_inactive = "inactive_blocks"

[panels.xwindow]
type = "xwindow"
max_width = 100

[panels.pulseaudio]
type = "pulseaudio"
attrs = "manual"
ramp_unmuted = "pa"
ramp_muted = "pa_muted"
click_left = "toggle"
scroll_up = "increment"
scroll_down = "decrement"
unit = 5

[panels.network]
type = "network"
if_name = "eth0"
format_connected = "<span foreground='#a6e3a1'>connected</span>"
format_disconnected = "<span foreground='#f38ba8'>disconnected</span>"

[panels.clock]
type = "clock"
precisions = ["minutes", "seconds"]
formats = [
	"<span>%Y-%m-%d</span> <span foreground='#f9e2af'>%H:%M</span>",
	"<span>%Y-%m-%d</span> <span foreground='#f9e2af'>%T</span>",
]
click_left = "cycle"
click_right = "cycle_back"

[panels.separator]
type = "separator"
attrs = "none"
format = "   "
dependence = "left"

[ramps.pa]
0 = "<span font_size='20pt' rise='-5pt'>󰕿</span>"
1 = "<span font_size='20pt' rise='-5pt'>󰖀</span>"
2 = "<span font_size='20pt' rise='-5pt'>󰕾</span>"

[ramps.pa_muted]
0 = "<span font_size='20pt' rise='-5pt'>󰸈</span>"
1 = "<span font_size='20pt' rise='-5pt'>󰖁</span>"
