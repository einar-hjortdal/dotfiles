[attrs.default]
bg = "#1e1e2e"
fg = "#cdd6f4"
font = "sans-serif 10"

[bars.top]
monitor = "DP-1"
position = "top"
height = 30
transparent = false
bg = "#1e1e2e"
default_attrs = "default"
margin_left = 10
margin_internal = 10
margin_right = 10
ipc = true
panels_left = ["xworkspaces", "separator", "xwindow"]
panels_center = ["pulseaudio"]
panels_right = ["network", "separator", "clock"]

[attrs.none]
bg = "none"

[attrs.manual]
# bg = "manual"

[attrs.mpd]
bg = "none"
fg = "#fff"

[attrs.active_blocks]
bg = "active"
[attrs.nonempty_blocks]
bg = "nonempty"
fg = "#89dceb"
[attrs.inactive_blocks]
bg = "inactive"
fg = "#6c7086"

[bgs.default]
style = "bubble_prop"
radius = 12
color = "#000"

[bgs.manual]
style = "bubble"
border = 8
radius = 12
color = "#000"

# bubble backgrounds with a radius of 0 are rectangles
[bgs.active]
style = "bubble_prop"
radius = 3
color = "#6c7086"

[bgs.inactive]
style = "bubble_prop"
radius = 3
color = "#0000"

[bgs.nonempty]
style = "bubble_prop"
radius = 0
color = "#0000"

[bgs.none]
style = "none"

[panels.xworkspaces]
type = "xworkspaces"
attrs_active = "active_blocks"
attrs_nonempty = "nonempty_blocks"
attrs_inactive = "inactive_blocks"

[panels.xwindow]
type = "xwindow"
max_width = 100

[panels.temp]
type = "temp"
format = "<span foreground='#0ff'>TEMP</span> %temp%°C"
zone = 7
interval = 2

# systray has known issues with bars that aren't transparent
[panels.systray]
type = "systray"
size = 24
padding = 0
sort = "window_name_lower"

[panels.memory]
type = "memory"
format = "<span foreground='#0ff'>RAM</span> %percentage_used%%"

[panels.cpu]
type = "cpu"
format = "<span foreground='#0ff'>CPU</span> %percentage%%"
interval = 2

[panels.pulseaudio]
type = "pulseaudio"
attrs = "manual"
ramp_unmuted = "pa"
ramp_muted = "pa_muted"
click_left = "toggle"
scroll_up = "increment"
scroll_down = "decrement"
unit = 5

[panels.network]
type = "network"
if_name = "eth0"
format_connected = "<span foreground='#a6e3a1'>connected</span>"
format_disconnected = "<span foreground='#f38ba8'>disconnected</span>"

[panels.mpd]
type = "mpd"
fg = "#fff"
attrs = "mpd"
progress_bar = true
max_width = 30
strategy = "scroll"
scroll_interval = 300
format_playing = "%shuffle% %main% <span font_size='20pt' rise='-5pt'>%prev% %toggle% %next%</span>"
format_paused = "%shuffle% %main% <span font_size='20pt' rise='-5pt'>%prev% %toggle% %next%</span>"
format_main = "%title% - %artist%"
format_shuffle = "<span font_size='25pt' rise='-7.5pt'>󰒟</span>"
format_prev = "󰒮"
format_toggle_playing = "󰏤"
format_toggle_paused = "󰐊"
format_next = "󰒭"

[panels.battery]
type = "battery"
format_full = "<span foreground='#89dceb'>chom</span>"

[panels.clock]
type = "clock"
precisions = ["minutes", "seconds"]
# toggle seconds
formats = [
	"<span>%Y-%m-%d</span> <span foreground='#f9e2af'>%H:%M</span>",
	"<span>%Y-%m-%d</span> <span foreground='#f9e2af'>%T</span>",
]
click_left = "cycle"
click_right = "cycle_back"

[panels.separator]
type = "separator"
attrs = "none"
format = "   "
dependence = "left"

[ramps.pa]
0 = "<span font_size='20pt' rise='-7.5pt'>󰕿</span>"
1 = "<span font_size='20pt' rise='-7.5pt'>󰖀</span>"
2 = "<span font_size='20pt' rise='-7.5pt'>󰕾</span>"

[ramps.pa_muted]
0 = "<span font_size='20pt' rise='-7.5pt'>󰸈</span>"
1 = "<span font_size='20pt' rise='-7.5pt'>󰖁</span>"
